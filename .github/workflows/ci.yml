name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_LAUNCH: "0"
      NEXT_PUBLIC_TALLY_FORM_ID: ci
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-publishable-key
      NEXT_PUBLIC_SITE_URL: https://gitprice.com
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - run: npm run build

  e2e:
    # Functional Playwright suite against local builds (prelaunch :3000 and launch :3001, both started by playwright.config.ts).
    # Pixel parity is skipped here: its baselines are Sketch exports, checked on the Vercel preview instead.
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SKIP_PARITY: "1"
      NEXT_PUBLIC_TALLY_FORM_ID: ci
      NEXT_PUBLIC_SITE_URL: https://gitprice.com
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
