name: Preview checks

# Vercel reports each finished deployment as a deployment_status event. Only a successful Preview deployment is checked
# (Production emits the same event and must not run these).
on: deployment_status

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_URL: ${{ github.event.deployment_status.target_url }}
      # The deployment's own launch mode decides which Playwright project applies: prelaunch or launch.
      SITE_MODE: ${{ vars.SITE_MODE || 'prelaunch' }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      # No secrets in scope here: lifecycle scripts of the checked-out code run during npm ci.
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Lighthouse budgets
        # lighthouserc.json keeps its localhost URLs for local runs (`npm run lighthouse` starts the server); --collect.url
        # replaces them here and no startServerCommand is set (lhci only starts a server when one is given).
        # Reports stay on disk: the bypass cookie must not end up on public temporary storage.
        env:
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          npx lhci autorun --config=lighthouserc.json \
            --collect.puppeteerScript=./scripts/lhci-bypass.cjs \
            --upload.target=filesystem --upload.outputDir=lhci-reports \
            --collect.url="$TARGET_URL/" \
            --collect.url="$TARGET_URL/ar" \
            --collect.url="$TARGET_URL/privacy" \
            --collect.url="$TARGET_URL/sellers" \
            --collect.url="$TARGET_URL/reset-password" \
            --collect.url="$TARGET_URL/checkout"

      - name: Visual parity and layout
        # Non-blocking until the baselines are recalibrated on Linux: the refs are macOS/Sketch renders, so font
        # rasterisation alone moves the ratios. Re-derive tolerances with PARITY_MEASURE=1 on this runner, then drop this.
        # Only the pages the coral redesign left alone still have Sketch refs; the new site is in the next step.
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --project="$SITE_MODE" e2e/parity.spec.ts e2e/layout.spec.ts

      - name: Visual baselines (new site)
        # Linux Chromium baselines from `npm run visual:update` (Playwright docker image, same version as package.json).
        # Non-blocking: the preview's env (sellers nav flag, Beta key, live rates) can differ from the local builds the baselines
        # come from; promote to blocking once a few previews match. Mismatch images land in the preview-reports artifact.
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --project="visual-$SITE_MODE"

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: preview-reports
          path: |
            test-results/
            lhci-reports/
          retention-days: 7
