name: Preview checks

# Vercel reports each finished deployment as a deployment_status event. Only a successful one is checked.
on: deployment_status

permissions:
  contents: read

jobs:
  preview:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ github.event.deployment_status.target_url }}
      # Optional: Vercel's Protection Bypass for Automation secret, for previews behind Deployment Protection.
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # The deployment's own launch mode decides which Playwright project applies: prelaunch or launch.
      SITE_MODE: ${{ vars.SITE_MODE || 'prelaunch' }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Lighthouse budgets
        # lighthouserc.json keeps its localhost URLs for local runs; --collect.url replaces them here.
        # An empty startServerCommand turns off the local `npm run start`.
        run: |
          npx lhci autorun --config=lighthouserc.json \
            --collect.startServerCommand= \
            --collect.url="$TARGET_URL/" \
            --collect.url="$TARGET_URL/ar" \
            --collect.url="$TARGET_URL/privacy" \
            --collect.url="$TARGET_URL/sellers" \
            --collect.url="$TARGET_URL/reset-password" \
            --collect.url="$TARGET_URL/checkout"

      - name: Visual parity and layout
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: npx playwright test --project="$SITE_MODE" e2e/parity.spec.ts e2e/parity.launch.spec.ts e2e/layout.spec.ts

      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: parity-diffs
          path: test-results/
          retention-days: 7
